version: 2.1

orbs:
  orb-tools: circleci/orb-tools@12.1

filters: &filters
  tags:
    only: /.*/

tag-only: &tag-only
  branches:
    ignore: /.*/
  tags:
    only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          filters: *filters
      - orb-tools/pack:
          filters: *filters
      - orb-tools/review:
          filters: *filters
          exclude: RC006,RC007,RC010  # RC006/RC007: private repo URL unreachable; RC010: machine executors

  test-deploy:
    jobs:
      - orb-tools/pack:
          filters: *tag-only
      - orb-tools/publish:
          orb_name: KofTwentyTwo/munitor
          vcs_type: << pipeline.project.type >>
          pub_type: production
          requires:
            - orb-tools/pack
          context:
            - orb-publishing
          filters: *tag-only

  snapshot:
    jobs:
      - orb-tools/pack:
          filters: *filters
      - orb-tools/publish:
          orb_name: KofTwentyTwo/munitor
          vcs_type: << pipeline.project.type >>
          pub_type: dev
          dev_tags: "dev:${CIRCLE_SHA1},dev:snapshot"
          requires:
            - orb-tools/pack
          context:
            - orb-publishing
          filters:
            branches:
              only:
                - develop
                - /feature\/.*/
