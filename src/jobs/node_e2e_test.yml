description: >
  Run Playwright E2E tests. Requires workspace from node_build_and_test.
parameters:
  node_version:
    type: string
    default: "20"
    description: Node.js major version to install.
  package_manager:
    type: string
    default: "npm"
    description: Package manager (npm, pnpm, yarn).
  test_dir:
    type: string
    default: e2e
    description: Directory containing Playwright tests.
  resource_class:
    type: enum
    enum:
      - medium
      - large
    default: large
    description: Machine resource class.
executor:
  name: machine
  resource_class: << parameters.resource_class >>
steps:
  - attach_workspace:
      at: .
  - install_node:
      version: << parameters.node_version >>
      package_manager: << parameters.package_manager >>
  - run_e2e_playwright:
      test_dir: << parameters.test_dir >>
  - store_artifacts:
      path: << parameters.test_dir >>/playwright-report
      destination: playwright-report
