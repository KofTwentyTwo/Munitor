description: >
  Run ESLint code quality checks.
  Requires workspace from node_build_and_test.
parameters:
  node_version:
    type: string
    default: "20"
    description: Node.js major version to install.
  package_manager:
    type: string
    default: "npm"
    description: Package manager (npm, pnpm, yarn).
  resource_class:
    type: enum
    enum:
      - medium
      - large
    default: medium
    description: Machine resource class.
executor:
  name: machine
  resource_class: << parameters.resource_class >>
steps:
  - attach_workspace:
      at: .
  - install_node:
      version: << parameters.node_version >>
      package_manager: << parameters.package_manager >>
  - node_lint
  - store_artifacts:
      path: /tmp/eslint-report.json
      destination: eslint-report.json
