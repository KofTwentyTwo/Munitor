description: >
  Enforce minimum coverage threshold from coverage output.
  Requires workspace from node_build_and_test.
parameters:
  node_version:
    type: string
    default: "20"
    description: Node.js major version to install.
  package_manager:
    type: string
    default: "npm"
    description: Package manager (npm, pnpm, yarn).
  min_coverage:
    type: string
    default: "70"
    description: Minimum line coverage percentage.
  coverage_tool:
    type: string
    default: "jest"
    description: Coverage tool (jest or nyc).
  coverage_command:
    type: string
    default: ""
    description: Custom command to generate coverage report before threshold check.
  coverage_summary_path:
    type: string
    default: "coverage/coverage-summary.json"
    description: >
      Path to coverage-summary.json. Supports glob patterns for monorepos.
  resource_class:
    type: enum
    enum:
      - medium
      - large
    default: medium
    description: Machine resource class.
executor:
  name: machine
  resource_class: << parameters.resource_class >>
steps:
  - attach_workspace:
      at: .
  - install_node:
      version: << parameters.node_version >>
      package_manager: << parameters.package_manager >>
  - node_coverage_check:
      min_coverage: << parameters.min_coverage >>
      coverage_tool: << parameters.coverage_tool >>
      coverage_command: << parameters.coverage_command >>
      coverage_summary_path: << parameters.coverage_summary_path >>
  - store_artifacts:
      path: coverage
      destination: coverage-report
