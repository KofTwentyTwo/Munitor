description: >
  Generate SBOM and submit dependency graph. Requires workspace from
  mvn_build_and_test.
parameters:
  java_version:
    type: string
    default: "21"
    description: Java major version to install.
  resource_class:
    type: enum
    enum:
      - medium
      - large
    default: large
    description: Docker resource class.
executor:
  name: java
  java_version: << parameters.java_version >>
  resource_class: << parameters.resource_class >>
steps:
  - attach_workspace:
      at: .
  - restore_maven_cache
  - mvn_sbom
  - submit_dependency_graph
  - store_artifacts:
      path: target/bom.json
      destination: sbom.json
