description: >
  Run npm audit and Trivy filesystem scan.
  Requires workspace from node_build_and_test.
parameters:
  node_version:
    type: string
    default: "20"
    description: Node.js major version to install.
  package_manager:
    type: string
    default: "npm"
    description: Package manager (npm, pnpm, yarn).
  resource_class:
    type: enum
    enum:
      - medium
      - large
    default: large
    description: Machine resource class.
executor:
  name: machine
  resource_class: << parameters.resource_class >>
steps:
  - attach_workspace:
      at: .
  - install_node:
      version: << parameters.node_version >>
      package_manager: << parameters.package_manager >>
  - node_audit
  - restore_trivy_cache
  - run_trivy
  - save_trivy_cache
  - store_artifacts:
      path: /tmp/trivy-results.json
      destination: trivy-results.json
