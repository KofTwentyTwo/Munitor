description: >
  Run SonarCloud analysis. Requires workspace from mvn_build_and_test.
parameters:
  java_version:
    type: string
    default: "21"
    description: Java major version to install.
  sonar_project_key:
    type: string
    description: SonarCloud project key.
  sonar_org:
    type: string
    default: dmdbrands
    description: SonarCloud organization.
  resource_class:
    type: enum
    enum:
      - medium
      - large
    default: large
    description: Machine resource class.
executor:
  name: machine
  resource_class: << parameters.resource_class >>
steps:
  - checkout
  - attach_workspace:
      at: .
  - install_java:
      version: << parameters.java_version >>
  - restore_maven_cache
  - mvn_sonar:
      sonar_project_key: << parameters.sonar_project_key >>
      sonar_org: << parameters.sonar_org >>
