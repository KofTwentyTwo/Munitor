description: >
  Generate coverage report and enforce minimum thresholds.
  Requires workspace from gradle_build_and_test.
parameters:
  java_version:
    type: string
    default: "21"
    description: Java major version to install.
  min_instruction:
    type: string
    default: "70"
    description: Minimum instruction coverage percentage.
  resource_class:
    type: enum
    enum:
      - medium
      - large
    default: large
    description: Docker resource class.
executor:
  name: java
  java_version: << parameters.java_version >>
  resource_class: << parameters.resource_class >>
steps:
  - attach_workspace:
      at: .
  - restore_gradle_cache
  - gradle_jacoco:
      min_instruction: << parameters.min_instruction >>
