description: >
  Full Maven build and test job. Installs Java, restores cache, calculates
  version, builds, tests, saves cache, and persists the workspace for
  downstream jobs.
parameters:
  quality_checks:
    type: boolean
    default: false
    description: Run quality and coverage checks on the build worker before sharing artifacts.
  min_instruction:
    type: string
    default: "70"
    description: Minimum instruction coverage when quality_checks is enabled.
  java_version:
    type: string
    default: "21"
    description: Java major version to install.
  resource_class:
    type: enum
    enum:
      - medium
      - large
      - xlarge
    default: large
    description: Machine resource class.
executor:
  name: machine
  resource_class: << parameters.resource_class >>
steps:
  - checkout
  - install_java:
      version: << parameters.java_version >>
  - restore_maven_cache
  - calculate_version
  - export_version_vars
  - allocate_version
  - mvn_set_version
  - mvn_build
  - mvn_test
  - when:
      condition: << parameters.quality_checks >>
      steps:
        - mvn_checkstyle
        - mvn_spotbugs
        - mvn_pmd
        - mvn_jacoco:
            min_instruction: << parameters.min_instruction >>
        - store_artifacts:
            path: target/checkstyle-result.xml
            destination: checkstyle-result.xml
        - store_artifacts:
            path: target/site/jacoco
            destination: coverage-report
  - run:
      name: Persist version metadata
      command: <<include(scripts/persist_version_metadata.sh)>>
  - save_maven_cache
  - persist_to_workspace:
      root: .
      paths:
        - "."
