description: >
  Run SonarCloud analysis for Node.js projects. Attaches workspace from
  node_build_and_test and uses the sonar-scanner CLI with bundled JRE.
parameters:
  node_version:
    type: string
    default: "20"
    description: Node.js major version to install.
  sonar_project_key:
    type: string
    description: SonarCloud project key.
  sonar_org:
    type: string
    default: KofTwentyTwo
    description: SonarCloud organization.
  resource_class:
    type: enum
    enum:
      - medium
      - large
    default: medium
    description: Machine resource class.
executor:
  name: machine
  resource_class: << parameters.resource_class >>
steps:
  - checkout
  - attach_workspace:
      at: .
  - install_node:
      version: << parameters.node_version >>
  - node_sonar:
      sonar_project_key: << parameters.sonar_project_key >>
      sonar_org: << parameters.sonar_org >>
