description: >
  Download and install the gitleaks binary for secret detection.
parameters:
  version:
    type: string
    default: "8.18.4"
    description: Gitleaks version to install.
steps:
  - run:
      name: Install gitleaks
      environment:
        GITLEAKS_VERSION: << parameters.version >>
      command: << include(scripts/install_gitleaks.sh) >>
