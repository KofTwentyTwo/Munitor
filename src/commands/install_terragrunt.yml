description: >
  Install Terragrunt for managing Terraform configurations.
parameters:
  version:
    type: string
    default: "0.77.0"
    description: Terragrunt version to install.
steps:
  - run:
      name: Install Terragrunt
      environment:
        TERRAGRUNT_VERSION: << parameters.version >>
      command: << include(scripts/install_terragrunt.sh) >>
