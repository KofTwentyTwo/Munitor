description: >
  Install a pinned version of kubesec.
parameters:
  version:
    type: string
    default: "2.14.0"
    description: kubesec version to install.
steps:
  - run:
      name: Install kubesec << parameters.version >>
      environment:
        KUBESEC_VERSION: << parameters.version >>
      command: << include(scripts/install_kubesec.sh) >>
