description: >
  Restore only the cache for the checked-out Maven dependency definitions.
steps:
  - run:
      name: Identify Maven dependency cache
      command: <<include(scripts/maven_cache_key.sh)>>
  - restore_cache:
      keys:
        - maven-v2-{{ checksum ".munitor-maven-cache-key" }}
  - run:
      name: Restore this build's installed Maven artifacts
      command: <<include(scripts/maven_workspace.sh)>>
