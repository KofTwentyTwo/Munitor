description: >
  Example showing how to use Munitor with a Node.js webapp repo.
  The node-webapp pipeline uses a user-provided Dockerfile (no auto-generation).
  Each repo needs two files: .circleci/config.yml and .munitor.yml.

usage:
  version: 2.1
  setup: true
  orbs:
    munitor: kof22/munitor@1
  workflows:
    setup:
      jobs:
        - munitor/generate_pipeline
