description: >
  Example showing how to use Munitor with an SDK distribution repo.
  Each repo needs .circleci/config.yml, .faber.yml, and .sdk-release.yml.

usage:
  version: 2.1
  setup: true
  orbs:
    munitor: KofTwentyTwo/munitor@1
  workflows:
    setup:
      jobs:
        - munitor/generate_pipeline
